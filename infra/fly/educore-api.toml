# Fly production — educore-api (B-05 topology)
#
# Provisioned separately from staging. Board 42 remains NO GO for public/school traffic
# until independent re-review. PAYMENT_PROVIDER stays fake until PAY-OPS keys.
#
# Deploy from repo root:
#   flyctl deploy -c infra/fly/educore-api.toml --remote-only
#
# dockerfile path is relative to this toml file (infra/fly/).

app = "educore-api"
primary_region = "fra"

[build]
  dockerfile = "../../apps/api/Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  SERVICE_NAME = "educore-api"
  CORS_ORIGINS = "https://educore-web.fly.dev"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "20s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
