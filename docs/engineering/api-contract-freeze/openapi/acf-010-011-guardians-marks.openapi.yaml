openapi: 3.1.0
info:
  title: EduCore API — Guardians & Marks (ACF-010 / ACF-011)
  version: 1.1.0
  description: >-
    Machine-readable contract for guardians (ACF-010 rev 1.0) and marks /
    assessment (ACF-011 rev 1.1, includes GET exam-subject). Solo-operator
    provisional (SOLO-GOV-001). Binding design baseline for implemented product
    HTTP; publishing this OpenAPI does not re-accept freezes.
    AuthZ stack (typical privileged route): Authenticated → Tenant header →
    Session tenant bind → Permission code → RLS. Extensions: x-permissions, x-authz.
  contact:
    name: EduCore Engineering
servers:
  - url: /api/v1
    description: Versioned API root
tags:
  - name: Guardians
  - name: Exams
  - name: ExamSubjects
  - name: Marks
paths:
  /guardians:
    get:
      tags:
        - Guardians
      operationId: listGuardians
      summary: List guardians in bound tenant
      security:
        - bearerAuth: []
          tenantHeader: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/GuardianStatus'
        - name: search
          in: query
          schema:
            type: string
          description: Case-insensitive match on displayName, phone, or email.
      responses:
        '200':
          description: Guardian page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuardianListEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-permissions:
        - guardian.read
      x-authz:
        stack:
          - authenticated
          - tenant_header
          - session_tenant_bind
          - active_membership
          - permission_codes
          - scope
          - rls
        permissionCodes:
          - guardian.read
        notes: Non-UUID cursor → 400. Invalid status → 400.
    post:
      tags:
        - Guardians
      operationId: createGuardian
      summary: Create guardian
      security:
        - bearerAuth: []
          tenantHeader: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGuardianRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuardianEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      x-permissions:
        - guardian.manage
      x-authz:
        stack:
          - authenticated
          - tenant_header
          - session_tenant_bind
          - active_membership
          - permission_codes
          - scope
          - rls
        permissionCodes:
          - guardian.manage
        notes: >-
          Body allowlist displayName, phone, email, status. Duplicate email → 409.
          Idempotency-Key required.
  /guardians/{guardianId}:
    get:
      tags:
        - Guardians
      operationId: getGuardian
      summary: Get guardian by id
      security:
        - bearerAuth: []
          tenantHeader: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/GuardianId'
      responses:
        '200':
          description: Guardian
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuardianEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-permissions:
        - guardian.read
      x-authz:
        stack:
          - authenticated
          - tenant_header
          - session_tenant_bind
          - active_membership
          - permission_codes
          - scope
          - rls
        permissionCodes:
          - guardian.read
        notes: Missing/cross-tenant → 404 Guardian not found.
    patch:
      tags:
        - Guardians
      operationId: patchGuardian
      summary: Update guardian fields
      security:
        - bearerAuth: []
          tenantHeader: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/GuardianId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchGuardianRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuardianEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      x-permissions:
        - guardian.manage
      x-authz:
        stack:
          - authenticated
          - tenant_header
          - session_tenant_bind
          - active_membership
          - permission_codes
          - scope
          - rls
        permissionCodes:
          - guardian.manage
        notes: >-
          Body allowlist displayName, phone, email, status; at least one required.
          Duplicate email → 409.
  /guardians/{guardianId}/links:
    get:
      tags:
        - Guardians
      operationId: listGuardianLinks
      summary: List student–guardian links for a guardian
      security:
        - bearerAuth: []
          tenantHeader: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/GuardianId'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/StudentGuardianLinkStatus'
          description: Optional filter; omit for active and ended.
      responses:
        '200':
          description: Links array (ids only; no nested student PII)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentGuardianLinkListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-permissions:
        - guardian.read
      x-authz:
        stack:
          - authenticated
          - tenant_header
          - session_tenant_bind
          - active_membership
          - permission_codes
          - scope
          - rls
        permissionCodes:
          - guardian.read
        notes: Guardian missing/cross-tenant → 404. Envelope is { data } without page.
    post:
      tags:
        - Guardians
      operationId: createGuardianLink
      summary: Link a student to a guardian
      security:
        - bearerAuth: []
          tenantHeader: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/GuardianId'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStudentGuardianLinkRequest'
      responses:
        '201':
          description: Created link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentGuardianLinkEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      x-permissions:
        - guardian.manage
      x-authz:
        stack:
          - authenticated
          - tenant_header
          - session_tenant_bind
          - active_membership
          - permission_codes
          - scope
          - rls
        permissionCodes:
          - guardian.manage
        notes: >-
          Student must exist in tenant. Duplicate active link → 409.
          Idempotency-Key required.
  /guardians/{guardianId}/links/{linkId}/end:
    post:
      tags:
        - Guardians
      operationId: endGuardianLink
      summary: End an active student–guardian link
      security:
        - bearerAuth: []
          tenantHeader: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/GuardianId'
        - $ref: '#/components/parameters/LinkId'
      responses:
        '200':
          description: Link ended (status=ended)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentGuardianLinkEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      x-permissions:
        - guardian.manage
      x-authz:
        stack:
          - authenticated
          - tenant_header
          - session_tenant_bind
          - active_membership
          - permission_codes
          - scope
          - rls
        permissionCodes:
          - guardian.manage
        notes: Already ended → 409. Missing/cross-tenant → 404.
  /students/{studentId}/guardians:
    get:
      tags:
        - Guardians
      operationId: listStudentGuardians
      summary: List guardian links for a student
      security:
        - bearerAuth: []
          tenantHeader: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/StudentId'
      responses:
        '200':
          description: Links array (ids only; no nested guardian PII)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentGuardianLinkListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-permissions:
        - guardian.read
      x-authz:
        stack:
          - authenticated
          - tenant_header
          - session_tenant_bind
          - active_membership
          - permission_codes
          - scope
          - rls
        permissionCodes:
          - guardian.read
        notes: Student missing/cross-tenant → 404. Envelope is { data } without page.
  /exams:
    get:
      tags:
        - Exams
      operationId: listExams
      summary: List exams in bound tenant
      security:
        - bearerAuth: []
          tenantHeader: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ExamStatus'
        - name: classId
          in: query
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Exam page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamListEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-permissions:
        - marks.read
      x-authz:
        stack:
          - authenticated
          - tenant_header
          - session_tenant_bind
          - active_membership
          - permission_codes
          - scope
          - rls
        permissionCodes:
          - marks.read
        notes: Non-UUID filters → 400. Foreign UUID filters → empty page.
    post:
      tags:
        - Exams
      operationId: createExam
      summary: Create exam
      security:
        - bearerAuth: []
          tenantHeader: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExamRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      x-permissions:
        - marks.manage
      x-authz:
        stack:
          - authenticated
          - tenant_header
          - session_tenant_bind
          - active_membership
          - permission_codes
          - scope
          - rls
        permissionCodes:
          - marks.manage
        notes: >-
          academicYearId/classId/termId tenant-scoped. Default status open.
          Idempotency-Key required.
  /exams/{examId}:
    get:
      tags:
        - Exams
      operationId: getExam
      summary: Get exam by id
      security:
        - bearerAuth: []
          tenantHeader: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ExamId'
      responses:
        '200':
          description: Exam
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-permissions:
        - marks.read
      x-authz:
        stack:
          - authenticated
          - tenant_header
          - session_tenant_bind
          - active_membership
          - permission_codes
          - scope
          - rls
        permissionCodes:
          - marks.read
        notes: Missing/cross-tenant → 404 Exam not found.
  /exams/{examId}/subjects:
    get:
      tags:
        - ExamSubjects
      operationId: listExamSubjects
      summary: List subjects for an exam
      security:
        - bearerAuth: []
          tenantHeader: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ExamId'
      responses:
        '200':
          description: Exam subjects array (no page)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamSubjectListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-permissions:
        - marks.read
      x-authz:
        stack:
          - authenticated
          - tenant_header
          - session_tenant_bind
          - active_membership
          - permission_codes
          - scope
          - rls
        permissionCodes:
          - marks.read
        notes: Exam missing/cross-tenant → 404. Envelope is { data } without page.
    post:
      tags:
        - ExamSubjects
      operationId: createExamSubject
      summary: Add a subject to an exam
      security:
        - bearerAuth: []
          tenantHeader: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ExamId'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExamSubjectRequest'
      responses:
        '201':
          description: Created exam subject
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamSubjectEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      x-permissions:
        - marks.manage
      x-authz:
        stack:
          - authenticated
          - tenant_header
          - session_tenant_bind
          - active_membership
          - permission_codes
          - scope
          - rls
        permissionCodes:
          - marks.manage
        notes: >-
          Unique (examId, subjectId). Duplicate → 409. Idempotency-Key required.
  /exam-subjects/{examSubjectId}:
    get:
      tags:
        - ExamSubjects
      operationId: getExamSubject
      summary: Get exam subject by id
      security:
        - bearerAuth: []
          tenantHeader: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ExamSubjectId'
      responses:
        '200':
          description: Exam subject
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamSubjectEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-permissions:
        - marks.read
      x-authz:
        stack:
          - authenticated
          - tenant_header
          - session_tenant_bind
          - active_membership
          - permission_codes
          - scope
          - rls
        permissionCodes:
          - marks.read
        notes: Missing/cross-tenant → 404 Exam subject not found. ACF-011 rev 1.1.
  /exam-subjects/{examSubjectId}/marks:
    get:
      tags:
        - Marks
      operationId: listMarks
      summary: List marks for an exam subject
      security:
        - bearerAuth: []
          tenantHeader: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ExamSubjectId'
      responses:
        '200':
          description: Marks array (ids only; no nested student PII)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-permissions:
        - marks.read
      x-authz:
        stack:
          - authenticated
          - tenant_header
          - session_tenant_bind
          - active_membership
          - permission_codes
          - scope
          - rls
        permissionCodes:
          - marks.read
        notes: Exam subject missing/cross-tenant → 404. Envelope is { data } without page.
    put:
      tags:
        - Marks
      operationId: upsertMarks
      summary: Bulk upsert marks for an exam subject
      security:
        - bearerAuth: []
          tenantHeader: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ExamSubjectId'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertMarksRequest'
      responses:
        '200':
          description: Upserted marks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkListEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      x-permissions:
        - marks.manage
      x-authz:
        stack:
          - authenticated
          - tenant_header
          - session_tenant_bind
          - active_membership
          - permission_codes
          - scope
          - rls
        permissionCodes:
          - marks.manage
        notes: >-
          Active enrollment required for exam class. Reject if exam_subject status
          ≠ draft (409). Score null or within 0…maxScore. Idempotency-Key required.
  /exam-subjects/{examSubjectId}/submit:
    post:
      tags:
        - ExamSubjects
      operationId: submitExamSubject
      summary: Submit exam subject (draft → submitted)
      security:
        - bearerAuth: []
          tenantHeader: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ExamSubjectId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      responses:
        '200':
          description: Submitted exam subject
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamSubjectEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      x-permissions:
        - marks.manage
      x-authz:
        stack:
          - authenticated
          - tenant_header
          - session_tenant_bind
          - active_membership
          - permission_codes
          - scope
          - rls
        permissionCodes:
          - marks.manage
        notes: Not draft → 409. Idempotency optional.
  /exam-subjects/{examSubjectId}/approve:
    post:
      tags:
        - ExamSubjects
      operationId: approveExamSubject
      summary: Approve exam subject (submitted → approved)
      security:
        - bearerAuth: []
          tenantHeader: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ExamSubjectId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      responses:
        '200':
          description: Approved exam subject
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamSubjectEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      x-permissions:
        - marks.approve
      x-authz:
        stack:
          - authenticated
          - tenant_header
          - session_tenant_bind
          - active_membership
          - permission_codes
          - scope
          - rls
        permissionCodes:
          - marks.approve
        notes: Not submitted → 409. Idempotency optional.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    tenantHeader:
      type: apiKey
      in: header
      name: X-Tenant-Id
  parameters:
    TenantIdHeader:
      name: X-Tenant-Id
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 16
        maxLength: 128
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        format: uuid
      description: Opaque UUID keyset cursor (last row id).
    GuardianId:
      name: guardianId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    LinkId:
      name: linkId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    StudentId:
      name: studentId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ExamId:
      name: examId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ExamSubjectId:
      name: examSubjectId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
  responses:
    BadRequest:
      description: Validation or tenant context error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Permission or session-tenant mismatch
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource not found (no existence leak)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Duplicate or invalid state transition
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    Uuid:
      type: string
      format: uuid
    GuardianStatus:
      type: string
      enum:
        - active
        - inactive
    StudentGuardianLinkStatus:
      type: string
      enum:
        - active
        - ended
    RelationshipType:
      type: string
      enum:
        - mother
        - father
        - guardian
        - other
    ExamStatus:
      type: string
      enum:
        - draft
        - open
        - closed
    ExamSubjectStatus:
      type: string
      enum:
        - draft
        - submitted
        - approved
    PageMeta:
      type: object
      additionalProperties: false
      required:
        - nextCursor
        - limit
      properties:
        nextCursor:
          type: string
          format: uuid
          nullable: true
        limit:
          type: integer
          minimum: 1
          maximum: 100
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
            - requestId
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              type: string
            details:
              type: object
              additionalProperties: true
    Guardian:
      type: object
      additionalProperties: false
      required:
        - id
        - tenantId
        - displayName
        - phone
        - email
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        tenantId:
          $ref: '#/components/schemas/Uuid'
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        phone:
          type: string
          nullable: true
          maxLength: 32
        email:
          type: string
          format: email
          nullable: true
          maxLength: 320
        status:
          $ref: '#/components/schemas/GuardianStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    GuardianEnvelope:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Guardian'
    GuardianListEnvelope:
      type: object
      additionalProperties: false
      required:
        - data
        - page
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Guardian'
        page:
          $ref: '#/components/schemas/PageMeta'
    CreateGuardianRequest:
      type: object
      additionalProperties: false
      required:
        - displayName
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        phone:
          type: string
          maxLength: 32
        email:
          type: string
          format: email
          maxLength: 320
        status:
          $ref: '#/components/schemas/GuardianStatus'
    PatchGuardianRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        phone:
          type: string
          nullable: true
          maxLength: 32
        email:
          type: string
          format: email
          nullable: true
          maxLength: 320
        status:
          $ref: '#/components/schemas/GuardianStatus'
    StudentGuardianLink:
      type: object
      additionalProperties: false
      required:
        - id
        - tenantId
        - studentId
        - guardianId
        - relationshipType
        - isPrimary
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        tenantId:
          $ref: '#/components/schemas/Uuid'
        studentId:
          $ref: '#/components/schemas/Uuid'
        guardianId:
          $ref: '#/components/schemas/Uuid'
        relationshipType:
          $ref: '#/components/schemas/RelationshipType'
        isPrimary:
          type: boolean
        status:
          $ref: '#/components/schemas/StudentGuardianLinkStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    StudentGuardianLinkEnvelope:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/StudentGuardianLink'
    StudentGuardianLinkListEnvelope:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/StudentGuardianLink'
    CreateStudentGuardianLinkRequest:
      type: object
      additionalProperties: false
      required:
        - studentId
        - relationshipType
      properties:
        studentId:
          $ref: '#/components/schemas/Uuid'
        relationshipType:
          $ref: '#/components/schemas/RelationshipType'
        isPrimary:
          type: boolean
          default: false
    Exam:
      type: object
      additionalProperties: false
      required:
        - id
        - tenantId
        - name
        - academicYearId
        - termId
        - classId
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        tenantId:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          minLength: 1
          maxLength: 200
        academicYearId:
          $ref: '#/components/schemas/Uuid'
        termId:
          type: string
          format: uuid
          nullable: true
        classId:
          $ref: '#/components/schemas/Uuid'
        status:
          $ref: '#/components/schemas/ExamStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ExamEnvelope:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Exam'
    ExamListEnvelope:
      type: object
      additionalProperties: false
      required:
        - data
        - page
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Exam'
        page:
          $ref: '#/components/schemas/PageMeta'
    CreateExamRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - academicYearId
        - classId
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        academicYearId:
          $ref: '#/components/schemas/Uuid'
        termId:
          $ref: '#/components/schemas/Uuid'
        classId:
          $ref: '#/components/schemas/Uuid'
        status:
          $ref: '#/components/schemas/ExamStatus'
    ExamSubject:
      type: object
      additionalProperties: false
      required:
        - id
        - tenantId
        - examId
        - subjectId
        - maxScore
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        tenantId:
          $ref: '#/components/schemas/Uuid'
        examId:
          $ref: '#/components/schemas/Uuid'
        subjectId:
          $ref: '#/components/schemas/Uuid'
        maxScore:
          type: number
          exclusiveMinimum: 0
          maximum: 9999.99
        status:
          $ref: '#/components/schemas/ExamSubjectStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ExamSubjectEnvelope:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/ExamSubject'
    ExamSubjectListEnvelope:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ExamSubject'
    CreateExamSubjectRequest:
      type: object
      additionalProperties: false
      required:
        - subjectId
        - maxScore
      properties:
        subjectId:
          $ref: '#/components/schemas/Uuid'
        maxScore:
          type: number
          exclusiveMinimum: 0
          maximum: 9999.99
    Mark:
      type: object
      additionalProperties: false
      required:
        - id
        - tenantId
        - examSubjectId
        - studentId
        - score
        - note
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        tenantId:
          $ref: '#/components/schemas/Uuid'
        examSubjectId:
          $ref: '#/components/schemas/Uuid'
        studentId:
          $ref: '#/components/schemas/Uuid'
        score:
          type: number
          nullable: true
          minimum: 0
        note:
          type: string
          nullable: true
          maxLength: 500
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    MarkListEnvelope:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Mark'
    UpsertMarksRequest:
      type: object
      additionalProperties: false
      required:
        - records
      properties:
        records:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required:
              - studentId
            properties:
              studentId:
                $ref: '#/components/schemas/Uuid'
              score:
                type: number
                nullable: true
                minimum: 0
              note:
                type: string
                nullable: true
                maxLength: 500
