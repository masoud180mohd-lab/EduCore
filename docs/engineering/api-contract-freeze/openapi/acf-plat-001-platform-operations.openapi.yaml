openapi: 3.1.0
info:
  title: EduCore API — Platform Operations (ACF-PLAT-001)
  version: 1.0.0
  description: >-
    Machine-readable contract for platform tenant lifecycle, manual plans,
    entitlement flags, and platform audit read. No X-Tenant-Id. Writes require
    privileged MFA. Publishing this OpenAPI does not authorize production GO.
  contact:
    name: EduCore Engineering
servers:
  - url: /api/v1
    description: Versioned API root
tags:
  - name: PlatformTenants
  - name: PlatformPlans
  - name: PlatformAudit
paths:
  /platform/tenants:
    get:
      tags: [PlatformTenants]
      operationId: listPlatformTenants
      summary: List schools for platform operators
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: cursor
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string, enum: [draft, active, suspended, closed] }
      responses:
        '200':
          description: Cursor page of tenants
        '400':
          description: X-Tenant-Id sent or invalid filter
        '401':
          description: Unauthenticated
        '403':
          description: Not a platform operator
    post:
      tags: [PlatformTenants]
      operationId: registerPlatformTenant
      summary: Register a school and bootstrap the initial owner
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name, primaryLocale, timezone, owner]
              properties:
                code: { type: string, pattern: '^[a-z0-9-]{3,64}$' }
                name: { type: string, minLength: 1, maxLength: 200 }
                primaryLocale: { type: string, enum: [en, sw] }
                timezone: { type: string, minLength: 3, maxLength: 64 }
                owner:
                  type: object
                  required: [email, displayName]
                  properties:
                    email: { type: string, format: email }
                    displayName: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '201':
          description: School registered
        '409':
          description: Tenant code already exists
  /platform/tenants/{id}:
    get:
      tags: [PlatformTenants]
      operationId: getPlatformTenant
      summary: School detail
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Tenant profile, plan, entitlements
        '404':
          description: Not found
  /platform/tenants/{id}/suspend:
    post:
      tags: [PlatformTenants]
      operationId: suspendPlatformTenant
      summary: Suspend an active school
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 5, maxLength: 500 }
      responses:
        '200':
          description: Suspended
  /platform/tenants/{id}/reinstate:
    post:
      tags: [PlatformTenants]
      operationId: reinstatePlatformTenant
      summary: Reinstate a suspended school
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 5, maxLength: 500 }
      responses:
        '200':
          description: Reinstated
  /platform/plans:
    get:
      tags: [PlatformPlans]
      operationId: listPlatformPlans
      summary: List plan catalog
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Plans
  /platform/tenants/{id}/plan:
    put:
      tags: [PlatformPlans]
      operationId: assignPlatformPlan
      summary: Assign a plan to a school
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planCode, reason]
              properties:
                planCode: { type: string }
                reason: { type: string, minLength: 5, maxLength: 500 }
      responses:
        '200':
          description: Plan assigned
  /platform/tenants/{id}/entitlements/{code}:
    put:
      tags: [PlatformTenants]
      operationId: setPlatformEntitlement
      summary: Upsert a platform entitlement flag
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: code
          in: path
          required: true
          schema: { type: string, enum: [sms, ai, payments.momo, student_portal] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled, reason]
              properties:
                enabled: { type: boolean }
                limit: { type: integer, minimum: 0, nullable: true }
                reason: { type: string, minLength: 5, maxLength: 500 }
      responses:
        '200':
          description: Entitlement saved
  /platform/audit:
    get:
      tags: [PlatformAudit]
      operationId: listPlatformAudit
      summary: List platform audit events
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: cursor
          in: query
          schema: { type: string, format: uuid }
        - name: tenantId
          in: query
          schema: { type: string, format: uuid }
        - name: action
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Cursor page of audit events
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
