openapi: 3.1.0
info:
  title: EduCore API — Students & Academic Structure (ACF-002…007)
  version: 1.0.0
  description: >-
    Machine-readable contract for students (ACF-002) and academic structure
    (ACF-003…007): academic years, terms, classes, streams, subjects.
    Solo-operator provisional (SOLO-GOV-001). Binding design baseline for
    implemented product HTTP; not freeze re-acceptance.
    AuthZ stack (typical privileged route): Authenticated → Tenant header →
    Session tenant bind → Permission code → RLS. Extensions: x-permissions, x-authz.
  contact:
    name: EduCore Engineering
servers:
  - url: /api/v1
    description: Versioned API root
tags:
  - name: Students
  - name: AcademicYears
  - name: Terms
  - name: Classes
  - name: Streams
  - name: Subjects
paths:
  /students:
    get:
      tags:
        - Students
      operationId: listStudents
      summary: List students in bound tenant
      security:
        - bearerAuth: []
          tenantHeader: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/StudentStatus'
        - name: search
          in: query
          schema:
            type: string
          description: Case-insensitive match on displayName or studentCode.
      responses:
        '200':
          description: Student page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentListEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-permissions:
        - student.read
      x-authz:
        stack:
          - authenticated
          - tenant_header
          - session_tenant_bind
          - active_membership
          - permission_codes
          - scope
          - rls
        permissionCodes:
          - student.read
        notes: Non-UUID cursor → 400. Invalid status → 400.
    post:
      tags:
        - Students
      operationId: createStudent
      summary: Create student
      security:
        - bearerAuth: []
          tenantHeader: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStudentRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      x-permissions:
        - student.manage
      x-authz:
        stack:
          - authenticated
          - tenant_header
          - session_tenant_bind
          - active_membership
          - permission_codes
          - scope
          - rls
        permissionCodes:
          - student.manage
        notes: >-
          displayName required. Duplicate studentCode in tenant → 409.
          Idempotency-Key required. No nested PII.
  /students/{studentId}:
    get:
      tags:
        - Students
      operationId: getStudent
      summary: Get student by id
      security:
        - bearerAuth: []
          tenantHeader: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/StudentId'
      responses:
        '200':
          description: Student
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-permissions:
        - student.read
      x-authz:
        stack:
          - authenticated
          - tenant_header
          - session_tenant_bind
          - active_membership
          - permission_codes
          - scope
          - rls
        permissionCodes:
          - student.read
        notes: Missing/cross-tenant → 404 Student not found.
    patch:
      tags:
        - Students
      operationId: patchStudent
      summary: Patch student fields
      security:
        - bearerAuth: []
          tenantHeader: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/StudentId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchStudentRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      x-permissions:
        - student.manage
      x-authz:
        stack:
          - authenticated
          - tenant_header
          - session_tenant_bind
          - active_membership
          - permission_codes
          - scope
          - rls
        permissionCodes:
          - student.manage
        notes: >-
          At least one of displayName, studentCode, status. studentCode null clears.
          Idempotency optional. Duplicate studentCode → 409.
