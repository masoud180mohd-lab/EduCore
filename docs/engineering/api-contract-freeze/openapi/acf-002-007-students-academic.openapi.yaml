        '403':
          $ref: '#/components/responses/Forbidden'
      x-permissions:
        - academic.read
      x-authz:
        stack:
          - authenticated
          - tenant_header
          - session_tenant_bind
          - active_membership
          - permission_codes
          - scope
          - rls
        permissionCodes:
          - academic.read
        notes: status draft|active|closed. Invalid status → 400.
    post:
      tags:
        - AcademicYears
      operationId: createAcademicYear
      summary: Create academic year
      security:
