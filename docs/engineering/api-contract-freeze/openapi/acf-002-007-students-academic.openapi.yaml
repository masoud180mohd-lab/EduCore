  responses:
    BadRequest:
      description: Validation or tenant context error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Permission or session-tenant mismatch
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource not found (no existence leak)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Duplicate or invalid state transition
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    Uuid:
      type: string
      format: uuid
    StudentStatus:
      type: string
      enum:
        - active
        - inactive
        - graduated
        - transferred
        - draft
    AcademicLifecycleStatus:
      type: string
      enum:
        - draft
        - active
        - closed
    PageMeta:
      type: object
      additionalProperties: false
      required:
        - nextCursor
        - limit
      properties:
        nextCursor:
          type: string
          format: uuid
          nullable: true
        limit:
          type: integer
          minimum: 1
          maximum: 100
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
            - requestId
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              type: string
            details:
              type: object
              additionalProperties: true
    Student:
      type: object
      additionalProperties: false
      required:
        - id
        - tenantId
        - studentCode
        - displayName
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        tenantId:
          $ref: '#/components/schemas/Uuid'
        studentCode:
          type: string
          nullable: true
        displayName:
          type: string
        status:
