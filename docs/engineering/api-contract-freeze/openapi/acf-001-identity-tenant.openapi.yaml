      operationId: endRelationship
      summary: End a relationship
      security:
        - bearerAuth: []
          tenantHeader: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/RelationshipId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      responses:
        '200':
          description: Ended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelationshipEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-permissions:
        - user.manage
      x-authz:
        stack:
          - authenticated
          - active_membership
          - permission_codes
          - scope
          - rls
        permissionCodes:
          - user.manage
        notes: Requires listed permission codes unless a documented self-service exception applies.
  /delegations:
    get:
      tags:
        - Delegations
      operationId: listDelegations
      summary: List delegations
      security:
        - bearerAuth: []
          tenantHeader: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Delegations page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DelegationListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-permissions:
        - user.manage
      x-authz:
        stack:
          - authenticated
          - active_membership
          - permission_codes
          - scope
          - rls
        permissionCodes:
          - user.manage
        notes: Requires listed permission codes unless a documented self-service exception applies.
    post:
      tags:
        - Delegations
      operationId: createDelegation
      summary: Create time-bound delegation
      security:
        - bearerAuth: []
          tenantHeader: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDelegationRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DelegationEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-permissions:
        - user.manage
      x-authz:
        stack:
          - authenticated
          - active_membership
          - permission_codes
          - scope
          - rls
        permissionCodes:
          - user.manage
        notes: Requires listed permission codes unless a documented self-service exception applies.
  /delegations/{delegationId}/revoke:
    post:
      tags:
        - Delegations
      operationId: revokeDelegation
      summary: Revoke delegation
      security:
        - bearerAuth: []
          tenantHeader: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/DelegationId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      responses:
        '200':
          description: Revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DelegationEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-permissions:
        - user.manage
      x-authz:
        stack:
          - authenticated
          - active_membership
          - permission_codes
          - scope
          - rls
        permissionCodes:
          - user.manage
        notes: Requires listed permission codes unless a documented self-service exception applies.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Access token from /auth/login or /auth/refresh. Format flexible until IdP ADR. Missing/invalid → 401
        UNAUTHORIZED.
    tenantHeader:
      type: apiKey
      in: header
      name: X-Tenant-Id
      description: >-
        Active tenant UUID. Required on tenant-scoped routes. Must match an active membership for the caller (or trusted
        platform path). Missing/invalid → 400 TENANT_CONTEXT_REQUIRED or 403 TENANT_MEMBERSHIP_REQUIRED.
  parameters:
    TenantIdHeader:
      name: X-Tenant-Id
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
      description: Active tenant; must match membership
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 16
        maxLength: 128
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    TenantId:
      name: tenantId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    UserId:
      name: userId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    MembershipId:
      name: membershipId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    RoleId:
      name: roleId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    UserRoleId:
      name: userRoleId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    FactorId:
      name: factorId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    RelationshipId:
      name: relationshipId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    DelegationId:
      name: delegationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Not authenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Not authorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Not found in tenant scope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: Rate limited
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    Uuid:
      type: string
      format: uuid
    IsoDateTime:
      type: string
      format: date-time
    ErrorEnvelope:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - requestId
          properties:
            code:
              type: string
              examples:
                - VALIDATION_ERROR
                - FORBIDDEN
                - NOT_FOUND
            message:
              type: string
            requestId:
              type: string
            details:
              type: object
              additionalProperties: true
    PageInfo:
      type: object
      required:
        - limit
      properties:
        nextCursor:
          type:
            - string
            - 'null'
        limit:
          type: integer
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        idpAssertion:
          type: string
          description: Optional external IdP assertion/token exchange payload
      description: Provide password pair or idpAssertion depending on auth mode
    LoginResponseEnvelope:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - requiresMfa
          properties:
            accessToken:
              type:
                - string
                - 'null'
            tokenType:
              type: string
              enum:
                - Bearer
            expiresIn:
              type:
                - integer
                - 'null'
            refreshToken:
              type:
                - string
                - 'null'
            requiresMfa:
              type: boolean
            mfaChallengeToken:
              type:
                - string
                - 'null'
            user:
              $ref: '#/components/schemas/User'
    MfaVerifyRequest:
      type: object
      required:
        - mfaChallengeToken
        - code
      properties:
        mfaChallengeToken:
          type: string
        code:
          type: string
    TokenRefreshResponseEnvelope:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - accessToken
            - tokenType
            - expiresIn
          properties:
            accessToken:
              type: string
            tokenType:
              type: string
              enum:
                - Bearer
            expiresIn:
              type: integer
    MeResponseEnvelope:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - user
            - memberships
          properties:
            user:
              $ref: '#/components/schemas/User'
            memberships:
              type: array
              items:
                $ref: '#/components/schemas/MembershipSummary'
            activeTenantId:
              type:
                - string
                - 'null'
              format: uuid
    SelectTenantResponseEnvelope:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - tenantId
          properties:
            tenantId:
              $ref: '#/components/schemas/Uuid'
            permissions:
              type: array
              items:
                type: string
    User:
      type: object
      required:
        - id
        - email
        - displayName
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        email:
          type: string
          format: email
        displayName:
          type: string
        status:
          type: string
          enum:
            - invited
            - active
            - disabled
            - locked
        emailVerifiedAt:
          type:
            - string
            - 'null'
          format: date-time
        lastLoginAt:
          type:
            - string
            - 'null'
          format: date-time
        createdAt:
          $ref: '#/components/schemas/IsoDateTime'
        updatedAt:
          $ref: '#/components/schemas/IsoDateTime'
    UserEnvelope:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/User'
    UserListEnvelope:
      type: object
      required:
        - data
        - page
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
        page:
          $ref: '#/components/schemas/PageInfo'
    UpdateUserRequest:
      type: object
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 120
    Tenant:
      type: object
      required:
        - id
        - code
        - name
        - status
        - primaryLocale
        - timezone
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        code:
          type: string
        name:
          type: string
        status:
          type: string
          enum:
            - draft
            - active
            - suspended
            - closed
        primaryLocale:
          type: string
        timezone:
          type: string
        createdAt:
          $ref: '#/components/schemas/IsoDateTime'
        updatedAt:
          $ref: '#/components/schemas/IsoDateTime'
    TenantEnvelope:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Tenant'
    TenantListEnvelope:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Tenant'
    CreateTenantRequest:
      type: object
      required:
        - code
        - name
      properties:
        code:
          type: string
          pattern: ^[a-z0-9-]{3,64}$
        name:
          type: string
        primaryLocale:
          type: string
          default: en
        timezone:
          type: string
          default: Africa/Dar_es_Salaam
        ownerUserId:
          $ref: '#/components/schemas/Uuid'
    UpdateTenantRequest:
      type: object
      properties:
        name:
          type: string
        primaryLocale:
          type: string
        timezone:
          type: string
    Organization:
      type: object
      required:
        - id
        - tenantId
        - orgType
        - name
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        tenantId:
          $ref: '#/components/schemas/Uuid'
        orgType:
          type: string
          enum:
            - school
            - campus
            - department
        name:
          type: string
        code:
          type:
            - string
            - 'null'
        status:
          type: string
          enum:
            - active
            - inactive
        parentOrganizationId:
          type:
            - string
            - 'null'
          format: uuid
        createdAt:
          $ref: '#/components/schemas/IsoDateTime'
        updatedAt:
          $ref: '#/components/schemas/IsoDateTime'
    OrganizationEnvelope:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Organization'
    OrganizationListEnvelope:
      type: object
      required:
        - data
