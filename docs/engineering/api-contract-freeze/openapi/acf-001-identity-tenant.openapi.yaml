      required:
        - id
        - factorType
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        factorType:
          type: string
          enum:
            - totp
            - webauthn
            - sms_otp
        status:
          type: string
          enum:
            - pending
            - active
            - disabled
        createdAt:
          $ref: '#/components/schemas/IsoDateTime'
        updatedAt:
          $ref: '#/components/schemas/IsoDateTime'
    MfaFactorEnvelope:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/MfaFactor'
    MfaFactorListEnvelope:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MfaFactor'
    BeginMfaEnrollmentRequest:
      type: object
      required:
        - factorType
      properties:
        factorType:
          type: string
          enum:
            - totp
            - webauthn
            - sms_otp
    MfaEnrollmentEnvelope:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - factor
          properties:
            factor:
              $ref: '#/components/schemas/MfaFactor'
            setup:
              type: object
              additionalProperties: true
              description: One-time enrollment material (e.g. otpauth URI); never re-exposed
    Relationship:
      type: object
      required:
        - id
        - tenantId
        - subjectUserId
        - objectType
        - objectId
        - relationshipType
        - status
        - startsAt
