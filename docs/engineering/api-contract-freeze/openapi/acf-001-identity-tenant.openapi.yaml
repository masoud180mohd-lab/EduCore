openapi: 3.1.0
info:
  title: EduCore API — Identity & Tenant Slice (ACF-001)
  version: 1.0.0
  description: >-
    API Contract Freeze ACF-001 for Identity And Access + Tenant And Billing.
    Status: Accepted Freeze v1.0 (solo-operator, SOLO-GOV-001). OpenAPI is the binding design
    baseline; product write routes (tenant create/update, role-admin, invites) remain
    implementation-gated. Implemented reads include AuthN under /auth/* and membership-scoped
    GET /tenants (+ permission-gated GET /tenants/{tenantId}). AuthZ stack (typical privileged
    route): Authenticated → Tenant header → Session tenant bind → Permission code → RLS.
    Extensions: x-permissions, x-authz.
  contact:
    name: EduCore Engineering
servers:
  - url: /api/v1
    description: Versioned API root
tags:
  - name: Auth
  - name: Sessions
  - name: Tenants
  - name: Organizations
  - name: TenantSettings
  - name: Entitlements
  - name: Users
  - name: Memberships
  - name: Roles
  - name: Permissions
  - name: UserRoles
  - name: Mfa
  - name: Relationships
  - name: Delegations
paths:
  /auth/login:
    post:
      tags:
        - Auth
      operationId: authLogin
      summary: Authenticate and create a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated or MFA challenge required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-permissions: []
      x-authz:
        stack:
          - public
          - scope
          - rls
        permissionCodes: []
        notes: >-
          No catalogue permission required (public or self-service). Membership still applies where stack lists
          active_membership.
  /auth/mfa/verify:
    post:
      tags:
        - Auth
      operationId: authMfaVerify
      summary: Complete MFA challenge after login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerifyRequest'
      responses:
        '200':
          description: MFA accepted; session tokens issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-permissions: []
      x-authz:
        stack:
          - public
          - scope
          - rls
        permissionCodes: []
        notes: >-
          No catalogue permission required (public or self-service). Membership still applies where stack lists
          active_membership.
  /auth/refresh:
    post:
      tags:
        - Auth
      operationId: authRefresh
      summary: Rotate access token using refresh credential
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  description: Optional when refresh cookie is used
      responses:
        '200':
          description: New access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefreshResponseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-permissions: []
      x-authz:
        stack:
          - public
          - scope
          - rls
        permissionCodes: []
        notes: >-
          No catalogue permission required (public or self-service). Membership still applies where stack lists
          active_membership.
  /auth/logout:
    post:
      tags:
        - Auth
      operationId: authLogout
      summary: Revoke the current session
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Logged out
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-permissions: []
      x-authz:
        stack:
          - authenticated
          - scope
          - rls
        permissionCodes: []
        notes: >-
          No catalogue permission required (public or self-service). Membership still applies where stack lists
          active_membership.
  /auth/me:
    get:
      tags:
        - Auth
      operationId: authMe
      summary: Current authenticated principal
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user and memberships
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-permissions: []
      x-authz:
        stack:
          - authenticated
          - scope
          - rls
        permissionCodes: []
        notes: >-
          No catalogue permission required (public or self-service). Membership still applies where stack lists
          active_membership.
  /auth/select-tenant:
    post:
      tags:
        - Auth
      operationId: authSelectTenant
      summary: Bind session to an active tenant membership
      security:
        - bearerAuth: []
          tenantHeader: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tenantId
              properties:
                tenantId:
                  $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Tenant selected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelectTenantResponseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-permissions:
        - tenant.read
      x-authz:
        stack:
          - authenticated
          - active_membership
          - permission_codes
          - scope
          - rls
        permissionCodes:
          - tenant.read
        notes: Requires listed permission codes unless a documented self-service exception applies.
  /sessions:
    get:
      tags:
        - Sessions
      operationId: listSessions
      summary: List sessions for current user or tenant (admin)
      security:
        - bearerAuth: []
          tenantHeader: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: userId
          in: query
          schema:
            $ref: '#/components/schemas/Uuid'
          description: Requires session.revoke when not self
      responses:
        '200':
          description: Session page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-permissions:
        - session.revoke
      x-authz:
        stack:
          - authenticated
          - active_membership
          - permission_codes
          - scope
          - rls
        permissionCodes:
          - session.revoke
        notes: Requires listed permission codes unless a documented self-service exception applies.
  /sessions/{sessionId}/revoke:
    post:
      tags:
        - Sessions
      operationId: revokeSession
      summary: Revoke a session
      security:
        - bearerAuth: []
          tenantHeader: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      responses:
        '204':
          description: Revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-permissions:
        - session.revoke
      x-authz:
        stack:
          - authenticated
          - active_membership
          - permission_codes
          - scope
          - rls
        permissionCodes:
          - session.revoke
        notes: Requires listed permission codes unless a documented self-service exception applies.
  /tenants:
    get:
      tags:
        - Tenants
      operationId: listAccessibleTenants
      summary: List tenants visible to the authenticated principal (active membership)
      description: |
        Membership-scoped "my tenants" list for picker / post-login UX.
        Does **not** require X-Tenant-Id or tenant.read.
        Visibility is enforced by RLS `can_see_tenant` (active membership).
        Empty `data: []` when the caller has no accessible tenants or the app DB pool is unavailable.

        **Pagination policy:** intentionally **unpaginated** envelope (`{ data }` only) — low
        cardinality per principal. Soft safety cap equals list max (100); excess rows are
        truncated with an ops warn. A future admin catalogue (if needed) would use cursor pages
        under a different operation, not this picker.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Accessible tenants (may be empty)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-permissions: []
      x-authz:
        stack:
          - authenticated
          - rls
        permissionCodes: []
        notes: >
          Self-service membership visibility only. Not an admin catalogue.
          Implemented under IMP-001 P5.
    post:
      tags:
        - Tenants
      operationId: createTenant
      summary: Provision a tenant (platform/bootstrap)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantRequest'
      responses:
        '201':
          description: Tenant created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      x-permissions:
        - tenant.manage
      x-authz:
        stack:
          - authenticated
          - permission_codes
          - scope
          - rls
        permissionCodes:
          - tenant.manage
        notes: Requires listed permission codes unless a documented self-service exception applies. Not implemented yet (write surface closed).
  /tenants/current:
    get:
      tags:
        - Tenants
      operationId: getCurrentTenant
      summary: Get tenant from X-Tenant-Id
      security:
        - bearerAuth: []
          tenantHeader: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
      responses:
        '200':
          description: Tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-permissions:
        - tenant.read
      x-authz:
        stack:
          - authenticated
          - tenant_header
          - session_tenant_bind
          - active_membership
          - permission_codes
          - scope
          - rls
        permissionCodes:
          - tenant.read
        notes: Session-bound tenant must match X-Tenant-Id. Implemented P5c.
  /tenants/{tenantId}:
    get:
      tags:
        - Tenants
      operationId: getTenant
      summary: Get tenant by id (bound tenant + tenant.read)
      description: |
        Returns the tenant identified by `{tenantId}` when:
        - Caller is authenticated with a session bound to that tenant
        - `X-Tenant-Id` equals `{tenantId}` (and equals session tenant)
        - Caller has `tenant.read` in that tenant
        - RLS still allows the row (active membership)

        Path/`X-Tenant-Id` mismatch → 403 (`TENANT_PATH_MISMATCH`).
        Missing / inaccessible tenant → 404 (no existence leak across tenants).
      security:
        - bearerAuth: []
          tenantHeader: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-permissions:
        - tenant.read
      x-authz:
        stack:
          - authenticated
          - tenant_header
          - session_tenant_bind
          - permission_codes
          - rls
        permissionCodes:
          - tenant.read
        notes: >
          Path tenantId MUST equal X-Tenant-Id and the session-bound tenant.
          Implemented under IMP-001 P5b + P5c.
    patch:
      tags:
        - Tenants
      operationId: updateTenant
      summary: Update tenant profile fields
      security:
        - bearerAuth: []
          tenantHeader: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTenantRequest'
      responses:
        '200':
          description: Updated tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-permissions:
        - tenant.manage
      x-authz:
        stack:
          - authenticated
          - active_membership
          - permission_codes
          - scope
          - rls
        permissionCodes:
          - tenant.manage
        notes: Requires listed permission codes unless a documented self-service exception applies.
  /organizations:
    get:
      tags:
        - Organizations
      operationId: listOrganizations
      summary: List organizations in tenant
      security:
        - bearerAuth: []
          tenantHeader: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          schema:
            type: string
            enum:
              - active
              - inactive
        - name: orgType
          in: query
          schema:
            type: string
            enum:
              - school
              - campus
              - department
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
          description: Case-insensitive substring on name/code (ILIKE; metacharacters escaped server-side).
      responses:
        '200':
          description: Organization page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-permissions:
        - organization.read
      x-authz:
        stack:
          - authenticated
          - tenant_header
          - session_tenant_bind
          - active_membership
          - permission_codes
          - scope
          - rls
        permissionCodes:
          - organization.read
        notes: >
          Session-bound tenant must match X-Tenant-Id. Implemented P6 + P8 filters (orgType, search).
    post:
      tags:
        - Organizations
      operationId: createOrganization
      summary: Create organization
      security:
        - bearerAuth: []
          tenantHeader: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-permissions:
        - organization.manage
      x-authz:
        stack:
          - authenticated
          - active_membership
          - permission_codes
          - scope
          - rls
        permissionCodes:
          - organization.manage
        notes: Requires listed permission codes unless a documented self-service exception applies.
  /organizations/{organizationId}:
    get:
      tags:
        - Organizations
      operationId: getOrganization
      summary: Get organization
      security:
        - bearerAuth: []
          tenantHeader: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-permissions:
        - organization.read
      x-authz:
        stack:
          - authenticated
          - tenant_header
          - session_tenant_bind
          - active_membership
          - permission_codes
          - scope
          - rls
        permissionCodes:
          - organization.read
        notes: Bound tenant only; missing/cross-tenant → 404. Implemented P7.
    patch:
      tags:
        - Organizations
      operationId: updateOrganization
      summary: Update organization
      security:
        - bearerAuth: []
          tenantHeader: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-permissions:
        - organization.manage
      x-authz:
        stack:
          - authenticated
          - active_membership
          - permission_codes
          - scope
          - rls
        permissionCodes:
          - organization.manage
        notes: Requires listed permission codes unless a documented self-service exception applies.
  /organizations/{organizationId}/deactivate:
    post:
      tags:
        - Organizations
      operationId: deactivateOrganization
      summary: Deactivate organization
      security:
        - bearerAuth: []
          tenantHeader: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      responses:
        '200':
          description: Deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-permissions:
        - organization.manage
      x-authz:
        stack:
          - authenticated
          - active_membership
          - permission_codes
          - scope
          - rls
        permissionCodes:
          - organization.manage
        notes: Requires listed permission codes unless a documented self-service exception applies.
  /tenant-settings:
    get:
      tags:
        - TenantSettings
      operationId: getTenantSettings
      summary: Get tenant settings document
      security:
        - bearerAuth: []
          tenantHeader: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantSettingsEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-permissions:
        - tenant.read
      x-authz:
        stack:
          - authenticated
          - tenant_header
          - session_tenant_bind
          - active_membership
          - permission_codes
          - scope
          - rls
        permissionCodes:
          - tenant.read
        notes: Session-bound tenant must match X-Tenant-Id. Implemented P5c.
    put:
      tags:
        - TenantSettings
      operationId: putTenantSettings
      summary: Replace tenant settings (validated schema)
      security:
        - bearerAuth: []
          tenantHeader: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantSettingsWrite'
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantSettingsEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-permissions:
        - tenant.manage
      x-authz:
        stack:
          - authenticated
          - active_membership
          - permission_codes
          - scope
          - rls
        permissionCodes:
          - tenant.manage
        notes: Requires listed permission codes unless a documented self-service exception applies.
  /entitlements:
    get:
      tags:
        - Entitlements
      operationId: listEntitlements
      summary: List tenant entitlements
      security:
        - bearerAuth: []
          tenantHeader: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Entitlements page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntitlementListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-permissions:
        - entitlement.read
      x-authz:
        stack:
          - authenticated
          - active_membership
          - permission_codes
          - scope
          - rls
        permissionCodes:
          - entitlement.read
        notes: Requires listed permission codes unless a documented self-service exception applies.
  /subscriptions/current:
    get:
      tags:
        - Entitlements
      operationId: getCurrentSubscription
      summary: Current subscription baseline
      security:
        - bearerAuth: []
          tenantHeader: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
      responses:
        '200':
          description: Subscription
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-permissions:
        - tenant.read
      x-authz:
        stack:
          - authenticated
          - active_membership
          - permission_codes
          - scope
          - rls
        permissionCodes:
          - tenant.read
        notes: Requires listed permission codes unless a documented self-service exception applies.
  /users:
    get:
      tags:
        - Users
      operationId: listUsers
      summary: List users visible in tenant
      security:
        - bearerAuth: []
          tenantHeader: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          schema:
            type: string
            enum:
              - invited
              - active
              - disabled
              - locked
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
          description: Case-insensitive substring on displayName/email (ILIKE; escaped server-side).
      responses:
        '200':
          description: User page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-permissions:
        - user.read
      x-authz:
        stack:
          - authenticated
          - tenant_header
          - session_tenant_bind
          - active_membership
          - permission_codes
          - scope
          - rls
        permissionCodes:
          - user.read
        notes: >
          Active membership users by default; `status=invited` includes invited memberships (ACF Q5).
          Implemented P9 + P12.
  /users/{userId}:
    get:
      tags:
        - Users
      operationId: getUser
      summary: Get user in tenant context
      security:
        - bearerAuth: []
