            - manual
            - trial
    EntitlementListEnvelope:
      type: object
      required:
        - data
        - page
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Entitlement'
        page:
          $ref: '#/components/schemas/PageInfo'
    SubscriptionEnvelope:
      type: object
      required:
        - data
