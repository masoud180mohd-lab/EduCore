        - code
        - name
        - isSystem
        - permissions
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        tenantId:
          $ref: '#/components/schemas/Uuid'
        code:
          type: string
        name:
          type: string
        isSystem:
          type: boolean
        permissions:
          type: array
          items:
            type: string
        createdAt:
          $ref: '#/components/schemas/IsoDateTime'
        updatedAt:
          $ref: '#/components/schemas/IsoDateTime'
    RoleEnvelope:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Role'
    RoleListEnvelope:
      type: object
      required:
        - data
        - page
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        page:
          $ref: '#/components/schemas/PageInfo'
    CreateRoleRequest:
