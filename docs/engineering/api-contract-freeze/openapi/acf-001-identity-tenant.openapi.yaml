            - revoked
            - expired
        createdAt:
          $ref: '#/components/schemas/IsoDateTime'
        expiresAt:
          $ref: '#/components/schemas/IsoDateTime'
        lastSeenAt:
          type:
            - string
            - 'null'
          format: date-time
        ip:
          type:
            - string
            - 'null'
        userAgent:
          type:
            - string
            - 'null'
    SessionListEnvelope:
      type: object
      required:
        - data
        - page
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Session'
        page:
          $ref: '#/components/schemas/PageInfo'
    MfaFactor:
