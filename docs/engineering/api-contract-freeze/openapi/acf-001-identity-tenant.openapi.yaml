        - userId
        - roleId
        - createdAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        tenantId:
          $ref: '#/components/schemas/Uuid'
        userId:
          $ref: '#/components/schemas/Uuid'
        roleId:
          $ref: '#/components/schemas/Uuid'
        organizationId:
          type:
            - string
            - 'null'
          format: uuid
        roleCode:
          type: string
        createdAt:
          $ref: '#/components/schemas/IsoDateTime'
    UserRoleEnvelope:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/UserRole'
    UserRoleListEnvelope:
      type: object
      required:
        - data
        - page
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/UserRole'
        page:
          $ref: '#/components/schemas/PageInfo'
    AssignUserRoleRequest:
      type: object
      required:
        - userId
        - roleId
      properties:
        userId:
          $ref: '#/components/schemas/Uuid'
        roleId:
          $ref: '#/components/schemas/Uuid'
        organizationId:
          $ref: '#/components/schemas/Uuid'
    Session:
      type: object
      required:
        - id
        - userId
        - tenantId
        - status
        - createdAt
        - expiresAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        userId:
          $ref: '#/components/schemas/Uuid'
        tenantId:
          $ref: '#/components/schemas/Uuid'
        status:
          type: string
          enum:
