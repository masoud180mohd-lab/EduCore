        schemaVersion:
          type: integer
          minimum: 1
        settings:
          type: object
          additionalProperties: true
    TenantSettingsEnvelope:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - schemaVersion
            - settings
            - updatedAt
          properties:
            schemaVersion:
              type: integer
            settings:
              type: object
              additionalProperties: true
            updatedAt:
              $ref: '#/components/schemas/IsoDateTime'
    Entitlement:
      type: object
