openapi: 3.1.0
info:
  title: EduCore API — Parent portal bind & scoped fees (ACF-013)
  version: 1.0.0
  description: >-
    Machine-readable contract for guardian↔user portal bind and parent-scoped
    fee reads (ACF-013 / DBF-011). Solo-operator provisional (SOLO-GOV-001).
    Does not re-accept kit-wide freezes. Real MoMo / parent pay remain out of
    scope (PAY-PROVIDER-001). AuthZ stack: Authenticated → Tenant header →
    Session tenant bind → Permission → RLS.
  contact:
    name: EduCore Engineering
servers:
  - url: /api/v1
    description: Versioned API root
tags:
  - name: GuardianPortalBind
  - name: ParentGuardian
  - name: ParentFees
paths:
  /guardians/{guardianId}/bind-user:
    post:
      tags: [GuardianPortalBind]
      operationId: bindGuardianUser
      summary: Bind an active-membership user to a guardian (portal login)
      security:
        - bearerAuth: []
          tenantHeader: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/GuardianId'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BindGuardianUserRequest'
      responses:
        '200':
          description: Guardian with userId set; parent role assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuardianEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      x-permissions: [guardian.manage]
      x-authz:
        stack:
          - authenticated
          - tenant_header
          - session_tenant_bind
          - active_membership
          - permission_codes
          - scope
          - rls
        permissionCodes: [guardian.manage]
        notes: >-
          Target user must have active membership. Assigns system role parent.
          Duplicate bind → 409.
  /guardians/{guardianId}/unbind-user:
    post:
      tags: [GuardianPortalBind]
      operationId: unbindGuardianUser
      summary: Clear portal bind and remove parent role only
      security:
        - bearerAuth: []
          tenantHeader: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/GuardianId'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      responses:
        '200':
          description: Guardian with userId null
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuardianEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-permissions: [guardian.manage]
      x-authz:
        stack:
          - authenticated
          - tenant_header
          - session_tenant_bind
          - active_membership
          - permission_codes
          - scope
          - rls
        permissionCodes: [guardian.manage]
  /me/guardian:
    get:
      tags: [ParentGuardian]
      operationId: getMyGuardian
      summary: Guardian bound to the caller
      security:
        - bearerAuth: []
          tenantHeader: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
      responses:
        '200':
          description: Bound guardian
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuardianEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-permissions: [parent.guardian.read]
      x-authz:
        stack:
          - authenticated
          - tenant_header
          - session_tenant_bind
          - active_membership
          - permission_codes
          - scope
          - rls
        permissionCodes: [parent.guardian.read]
        notes: Unbound caller → 404.
  /me/guardian/links:
    get:
      tags: [ParentGuardian]
      operationId: listMyGuardianLinks
      summary: Student links for the caller’s bound guardian
      security:
        - bearerAuth: []
          tenantHeader: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
      responses:
        '200':
          description: Links with optional studentDisplayName
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParentLinkListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-permissions: [parent.guardian.read]
      x-authz:
        stack:
          - authenticated
          - tenant_header
          - session_tenant_bind
          - active_membership
          - permission_codes
          - scope
          - rls
        permissionCodes: [parent.guardian.read]
  /me/fees/invoices:
    get:
      tags: [ParentFees]
      operationId: listMyFeesInvoices
      summary: List invoices for one actively linked student
      security:
        - bearerAuth: []
          tenantHeader: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: studentId
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: status
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Invoice page (ACF-012 shape)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceListEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-permissions: [parent.finance.read]
      x-authz:
        stack:
          - authenticated
          - tenant_header
          - session_tenant_bind
          - active_membership
          - permission_codes
          - scope
          - rls
        permissionCodes: [parent.finance.read]
        notes: >-
          studentId required. Not in active allowlist → 403.
          Never lists all-tenant invoices.
  /me/fees/invoices/{invoiceId}:
    get:
      tags: [ParentFees]
      operationId: getMyFeesInvoice
      summary: Invoice detail if allowlisted
      security:
        - bearerAuth: []
          tenantHeader: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/InvoiceId'
      responses:
        '200':
          description: Invoice with lines
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceDetailEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-permissions: [parent.finance.read]
      x-authz:
        stack:
          - authenticated
          - tenant_header
          - session_tenant_bind
          - active_membership
          - permission_codes
          - scope
          - rls
        permissionCodes: [parent.finance.read]
  /me/fees/invoices/{invoiceId}/payments:
    get:
      tags: [ParentFees]
      operationId: listMyFeesInvoicePayments
      summary: Payments for allowlisted invoice
      security:
        - bearerAuth: []
          tenantHeader: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/InvoiceId'
      responses:
        '200':
          description: Payment list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-permissions: [parent.finance.read]
      x-authz:
        stack:
          - authenticated
          - tenant_header
          - session_tenant_bind
          - active_membership
          - permission_codes
          - scope
          - rls
        permissionCodes: [parent.finance.read]
  /me/fees/receipts/{receiptId}:
    get:
      tags: [ParentFees]
      operationId: getMyFeesReceipt
      summary: Receipt for allowlisted student (embeds payment summary)
      security:
        - bearerAuth: []
          tenantHeader: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ReceiptId'
      responses:
        '200':
          description: Receipt + nested payment summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParentReceiptEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-permissions: [parent.finance.read]
      x-authz:
        stack:
          - authenticated
          - tenant_header
          - session_tenant_bind
          - active_membership
          - permission_codes
          - scope
          - rls
        permissionCodes: [parent.finance.read]
        notes: No reconcile / pay mutations on this surface.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    tenantHeader:
      type: apiKey
      in: header
      name: X-Tenant-Id
  parameters:
    TenantIdHeader:
      name: X-Tenant-Id
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    GuardianId:
      name: guardianId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    InvoiceId:
      name: invoiceId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ReceiptId:
      name: receiptId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        format: uuid
  schemas:
    Uuid:
      type: string
      format: uuid
    MinorUnits:
      type: integer
    PageMeta:
      type: object
      additionalProperties: false
      required: [nextCursor, limit]
      properties:
        nextCursor:
          type: string
          format: uuid
          nullable: true
        limit:
          type: integer
    ErrorBody:
      type: object
      additionalProperties: false
      required: [code, message, requestId]
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
        details:
          type: object
          additionalProperties: true
    Guardian:
      type: object
      additionalProperties: false
      required:
        - id
        - tenantId
        - displayName
        - phone
        - email
        - status
        - userId
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        tenantId:
          $ref: '#/components/schemas/Uuid'
        displayName:
          type: string
        phone:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        status:
          type: string
          enum: [active, inactive]
        userId:
          $ref: '#/components/schemas/Uuid'
          nullable: true
          description: Portal bind (DBF-011); null when unbound.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    GuardianEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Guardian'
    BindGuardianUserRequest:
      type: object
      additionalProperties: false
      required: [userId]
      properties:
        userId:
          $ref: '#/components/schemas/Uuid'
    ParentLink:
      type: object
      additionalProperties: false
      required:
        - id
        - tenantId
        - studentId
        - guardianId
        - relationshipType
        - isPrimary
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        tenantId:
          $ref: '#/components/schemas/Uuid'
        studentId:
          $ref: '#/components/schemas/Uuid'
        guardianId:
          $ref: '#/components/schemas/Uuid'
        relationshipType:
          type: string
        isPrimary:
          type: boolean
        status:
          type: string
          enum: [active, ended]
        studentDisplayName:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ParentLinkListEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ParentLink'
    Invoice:
      type: object
      additionalProperties: true
      description: Read fields aligned with ACF-012 Invoice (balanceMinor derived).
      required:
        - id
        - studentId
        - status
        - totalMinor
        - balanceMinor
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        studentId:
          $ref: '#/components/schemas/Uuid'
        status:
          type: string
        totalMinor:
          $ref: '#/components/schemas/MinorUnits'
        balanceMinor:
          $ref: '#/components/schemas/MinorUnits'
    InvoiceListEnvelope:
      type: object
      additionalProperties: false
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Invoice'
        page:
          $ref: '#/components/schemas/PageMeta'
    InvoiceDetail:
      allOf:
        - $ref: '#/components/schemas/Invoice'
        - type: object
          required: [lines]
          properties:
            lines:
              type: array
              items:
                type: object
                additionalProperties: true
    InvoiceDetailEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/InvoiceDetail'
    Payment:
      type: object
      additionalProperties: true
      required: [id, amountMinor, status]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        amountMinor:
          $ref: '#/components/schemas/MinorUnits'
        status:
          type: string
        method:
          type: string
        receiptId:
          $ref: '#/components/schemas/Uuid'
          nullable: true
    PaymentListEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Payment'
    ParentReceipt:
      type: object
      additionalProperties: false
      required:
        - id
        - paymentAttemptId
        - receiptNumber
        - status
        - issuedAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        paymentAttemptId:
          $ref: '#/components/schemas/Uuid'
        receiptNumber:
          type: string
        status:
          type: string
        issuedAt:
          type: string
          format: date-time
        payment:
          type: object
          additionalProperties: false
          properties:
            id:
              $ref: '#/components/schemas/Uuid'
            invoiceId:
              $ref: '#/components/schemas/Uuid'
            method:
              type: string
            amountMinor:
              $ref: '#/components/schemas/MinorUnits'
            currency:
              type: string
            status:
              type: string
    ParentReceiptEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/ParentReceipt'
  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    Unauthorized:
      description: Missing/invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    Forbidden:
      description: Missing permission or isolation deny
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    Conflict:
      description: Bind conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
