openapi: 3.1.0
info:
  title: EduCore API — Enrollments & Attendance (ACF-008 / ACF-009)
  version: 1.0.0
  description: >-
    Machine-readable contract for enrollments (ACF-008 rev 1.3) and attendance
    sessions/records (ACF-009 rev 1.3). Solo-operator provisional (SOLO-GOV-001).
    Binding design baseline for implemented product HTTP; not freeze re-acceptance.
    AuthZ stack (typical privileged route): Authenticated → Tenant header →
    Session tenant bind → Permission code → RLS. Extensions: x-permissions, x-authz.
  contact:
    name: EduCore Engineering
servers:
  - url: /api/v1
    description: Versioned API root
tags:
  - name: Enrollments
  - name: AttendanceSessions
paths:
  /enrollments:
    get:
      tags:
        - Enrollments
      operationId: listEnrollments
      summary: List enrollments in bound tenant
      security:
        - bearerAuth: []
          tenantHeader: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: studentId
          in: query
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: classId
          in: query
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: academicYearId
          in: query
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: streamId
          in: query
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/EnrollmentStatus'
      responses:
        '200':
          description: Enrollment page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentListEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-permissions:
        - academic.read
      x-authz:
        stack:
          - authenticated
          - tenant_header
          - session_tenant_bind
          - active_membership
          - permission_codes
          - scope
          - rls
        permissionCodes:
          - academic.read
        notes: Non-UUID filters → 400. Foreign UUID filters → empty page.
    post:
      tags:
        - Enrollments
      operationId: createEnrollment
      summary: Create enrollment
      security:
        - bearerAuth: []
          tenantHeader: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEnrollmentRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      x-permissions:
        - academic.manage
      x-authz:
        stack:
          - authenticated
          - tenant_header
          - session_tenant_bind
          - active_membership
          - permission_codes
          - scope
          - rls
        permissionCodes:
          - academic.manage
        notes: >-
          studentId/classId/streamId tenant-scoped via DEFINER helper. Year/term
          derived from class. Idempotency-Key required.
  /enrollments/{enrollmentId}:
    get:
      tags:
        - Enrollments
      operationId: getEnrollment
      summary: Get enrollment by id
      security:
        - bearerAuth: []
          tenantHeader: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/EnrollmentId'
      responses:
        '200':
          description: Enrollment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-permissions:
        - academic.read
      x-authz:
        stack:
          - authenticated
          - tenant_header
          - session_tenant_bind
          - active_membership
          - permission_codes
          - scope
          - rls
        permissionCodes:
          - academic.read
        notes: Missing/cross-tenant → 404 Enrollment not found.
    patch:
      tags:
        - Enrollments
      operationId: patchEnrollment
      summary: Update enrollment status
      security:
        - bearerAuth: []
          tenantHeader: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/EnrollmentId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchEnrollmentRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-permissions:
        - academic.manage
      x-authz:
        stack:
          - authenticated
          - tenant_header
          - session_tenant_bind
          - active_membership
          - permission_codes
          - scope
          - rls
        permissionCodes:
          - academic.manage
        notes: Body allowlist status only. Idempotency optional.
  /attendance-sessions:
    get:
      tags:
        - AttendanceSessions
      operationId: listAttendanceSessions
      summary: List attendance sessions in bound tenant
      security:
        - bearerAuth: []
          tenantHeader: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: classId
          in: query
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: sessionDate
          in: query
          schema:
            type: string
            format: date
          description: ISO calendar date YYYY-MM-DD
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/AttendanceSessionStatus'
      responses:
        '200':
          description: Attendance session page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceSessionListEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-permissions:
        - attendance.read
      x-authz:
        stack:
          - authenticated
          - tenant_header
          - session_tenant_bind
          - active_membership
          - permission_codes
          - scope
          - rls
        permissionCodes:
          - attendance.read
        notes: Order session_date DESC, id ASC keyset.
    post:
      tags:
        - AttendanceSessions
      operationId: createAttendanceSession
      summary: Open an attendance session
      security:
        - bearerAuth: []
          tenantHeader: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAttendanceSessionRequest'
      responses:
        '201':
          description: Created open session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceSessionEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      x-permissions:
        - attendance.manage
      x-authz:
        stack:
          - authenticated
          - tenant_header
          - session_tenant_bind
          - active_membership
          - permission_codes
          - scope
          - rls
        permissionCodes:
          - attendance.manage
        notes: >-
          academicYearId/termId derived from class. Duplicate class/stream/date → 409.
          Idempotency-Key required.
  /attendance-sessions/{sessionId}:
    get:
      tags:
        - AttendanceSessions
      operationId: getAttendanceSession
      summary: Get attendance session by id
      security:
        - bearerAuth: []
          tenantHeader: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/AttendanceSessionId'
      responses:
        '200':
          description: Attendance session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceSessionEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-permissions:
        - attendance.read
      x-authz:
        stack:
          - authenticated
          - tenant_header
          - session_tenant_bind
          - active_membership
          - permission_codes
          - scope
          - rls
        permissionCodes:
          - attendance.read
        notes: Missing/cross-tenant → 404 Attendance session not found.
  /attendance-sessions/{sessionId}/close:
    post:
      tags:
        - AttendanceSessions
      operationId: closeAttendanceSession
      summary: Close an open attendance session
      security:
        - bearerAuth: []
          tenantHeader: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/AttendanceSessionId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      responses:
        '200':
          description: Closed session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceSessionEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      x-permissions:
        - attendance.manage
      x-authz:
        stack:
          - authenticated
          - tenant_header
          - session_tenant_bind
          - active_membership
          - permission_codes
          - scope
          - rls
        permissionCodes:
          - attendance.manage
        notes: Already closed → 409. Idempotency recommended.
  /attendance-sessions/{sessionId}/records:
    get:
      tags:
        - AttendanceSessions
      operationId: listAttendanceRecords
      summary: List records for an attendance session
      security:
        - bearerAuth: []
          tenantHeader: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/AttendanceSessionId'
      responses:
        '200':
          description: Records array (ids only; no nested student PII)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceRecordListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-permissions:
        - attendance.read
      x-authz:
        stack:
          - authenticated
          - tenant_header
          - session_tenant_bind
          - active_membership
          - permission_codes
          - scope
          - rls
        permissionCodes:
          - attendance.read
        notes: Session missing/cross-tenant → 404.
    put:
      tags:
        - AttendanceSessions
      operationId: upsertAttendanceRecords
      summary: Bulk upsert attendance records
      security:
        - bearerAuth: []
          tenantHeader: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/AttendanceSessionId'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertAttendanceRecordsRequest'
      responses:
        '200':
          description: Upserted records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceRecordListEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      x-permissions:
        - attendance.manage
      x-authz:
        stack:
          - authenticated
          - tenant_header
          - session_tenant_bind
          - active_membership
          - permission_codes
          - scope
          - rls
        permissionCodes:
          - attendance.manage
        notes: >-
          Active enrollment required for session class (stream-aware when session
          stream set). Closed session → 409. Non-enrolled → 400. Idempotency-Key required.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    tenantHeader:
      type: apiKey
      in: header
      name: X-Tenant-Id
  parameters:
    TenantIdHeader:
      name: X-Tenant-Id
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 16
        maxLength: 128
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        format: uuid
      description: Opaque UUID keyset cursor (last row id).
    EnrollmentId:
      name: enrollmentId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    AttendanceSessionId:
      name: sessionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
  responses:
    BadRequest:
      description: Validation or tenant context error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Permission or session-tenant mismatch
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource not found (no existence leak)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Duplicate or invalid state transition
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    Uuid:
      type: string
      format: uuid
    EnrollmentStatus:
      type: string
      enum:
        - active
        - withdrawn
        - completed
        - suspended
    AttendanceSessionStatus:
      type: string
      enum:
        - open
        - closed
    AttendanceRecordStatus:
      type: string
      enum:
        - present
        - absent
        - late
        - excused
    PageMeta:
      type: object
      additionalProperties: false
      required:
        - nextCursor
        - limit
      properties:
        nextCursor:
          type: string
          format: uuid
          nullable: true
        limit:
          type: integer
          minimum: 1
          maximum: 100
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
            - requestId
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              type: string
            details:
              type: object
              additionalProperties: true
    Enrollment:
      type: object
      additionalProperties: false
      required:
        - id
        - tenantId
        - studentId
        - classId
        - streamId
        - academicYearId
        - termId
        - status
        - enrolledAt
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        tenantId:
          $ref: '#/components/schemas/Uuid'
        studentId:
          $ref: '#/components/schemas/Uuid'
        classId:
          $ref: '#/components/schemas/Uuid'
        streamId:
          type: string
          format: uuid
          nullable: true
        academicYearId:
          $ref: '#/components/schemas/Uuid'
        termId:
          type: string
          format: uuid
          nullable: true
        status:
          $ref: '#/components/schemas/EnrollmentStatus'
        enrolledAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    EnrollmentEnvelope:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Enrollment'
    EnrollmentListEnvelope:
      type: object
      additionalProperties: false
      required:
        - data
        - page
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Enrollment'
        page:
          $ref: '#/components/schemas/PageMeta'
    CreateEnrollmentRequest:
      type: object
      additionalProperties: false
      required:
        - studentId
        - classId
      properties:
        studentId:
          $ref: '#/components/schemas/Uuid'
        classId:
          $ref: '#/components/schemas/Uuid'
        streamId:
          $ref: '#/components/schemas/Uuid'
        status:
          $ref: '#/components/schemas/EnrollmentStatus'
    PatchEnrollmentRequest:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/EnrollmentStatus'
    AttendanceSession:
      type: object
      additionalProperties: false
      required:
        - id
        - tenantId
        - classId
        - streamId
        - academicYearId
        - termId
        - sessionDate
        - status
        - notes
        - createdByUserId
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        tenantId:
          $ref: '#/components/schemas/Uuid'
        classId:
          $ref: '#/components/schemas/Uuid'
        streamId:
          type: string
          format: uuid
          nullable: true
        academicYearId:
          $ref: '#/components/schemas/Uuid'
        termId:
          type: string
          format: uuid
          nullable: true
        sessionDate:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/AttendanceSessionStatus'
        notes:
          type: string
          nullable: true
          maxLength: 500
        createdByUserId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AttendanceSessionEnvelope:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/AttendanceSession'
    AttendanceSessionListEnvelope:
      type: object
      additionalProperties: false
      required:
        - data
        - page
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AttendanceSession'
        page:
          $ref: '#/components/schemas/PageMeta'
    CreateAttendanceSessionRequest:
      type: object
      additionalProperties: false
      required:
        - classId
        - sessionDate
      properties:
        classId:
          $ref: '#/components/schemas/Uuid'
        streamId:
          $ref: '#/components/schemas/Uuid'
        sessionDate:
          type: string
          format: date
        notes:
          type: string
          maxLength: 500
    AttendanceRecord:
      type: object
      additionalProperties: false
      required:
        - id
        - tenantId
        - sessionId
        - studentId
        - status
        - note
        - markedAt
        - markedByUserId
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        tenantId:
          $ref: '#/components/schemas/Uuid'
        sessionId:
          $ref: '#/components/schemas/Uuid'
        studentId:
          $ref: '#/components/schemas/Uuid'
        status:
          $ref: '#/components/schemas/AttendanceRecordStatus'
        note:
          type: string
          nullable: true
          maxLength: 500
        markedAt:
          type: string
          format: date-time
        markedByUserId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AttendanceRecordListEnvelope:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AttendanceRecord'
    UpsertAttendanceRecordsRequest:
      type: object
      additionalProperties: false
      required:
        - records
      properties:
        records:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required:
              - studentId
              - status
            properties:
              studentId:
                $ref: '#/components/schemas/Uuid'
              status:
                $ref: '#/components/schemas/AttendanceRecordStatus'
              note:
                type: string
                maxLength: 500
