name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: npm run check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # dependency-cruiser (boundaries:check) requires ^22 || ^24 || >=26
          node-version: '22'
          cache: npm

      - name: Print Node/npm versions
        run: |
          node -v
          npm -v
          # Fail fast if Actions somehow still lands on Node 20
          node -e "const m=+process.versions.node.split('.')[0]; if(m<22){console.error('Need Node >=22, got',process.version); process.exit(1)}"

      - name: Install dependencies
        run: npm ci

      - name: Quality gate
        run: npm run check
        env:
          NODE_ENV: test
          # Live Postgres isolation stays opt-in; CI baseline does not require Docker services yet.
          RUN_LIVE_DB_TESTS: '0'
